; databox beacon — joins the venue WiFi as a client and drives a 16-LED ring in
; response to /known, /unknown, /off HTTP hits from the control console.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
upload_speed = 460800   ; CH340 boards are unreliable at 921600

lib_deps =
    fastled/FastLED @ 3.10.3   ; pinned: 3.10.5 falls back to the GENERIC driver (reds render white)
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
