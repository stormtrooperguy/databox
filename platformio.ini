; PlatformIO project for the RFID Cartridge Player (ESP32)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; CH340 boards are unreliable at 921600

; The DFR1173 voice module is driven with raw UART command frames in
; src/main.cpp, so it needs no library. Adafruit PN532 pulls in Adafruit BusIO
; automatically.
lib_deps =
    adafruit/Adafruit PN532@^1.3.4
    fastled/FastLED@^3.7.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
