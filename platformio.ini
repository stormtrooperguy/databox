; PlatformIO project for the RFID Cartridge Player (ESP32)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The DFR1173 voice module is driven with raw UART command frames in
; src/main.cpp, so it needs no library.
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    fastled/FastLED@^3.7.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
