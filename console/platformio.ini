; databox control console — ESP32 + ~402 addressable LEDs across 5 panels.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; CH340 boards are unreliable at 921600

lib_deps =
    fastled/FastLED @ ^3.7.0
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
